# The manifest the PLATFORM reads when it builds this repo itself.
#
# Byte-identical to `manifest.toml` beside it, and the duplication is the point
# rather than an oversight. The two are read by two different doors:
#
#   * `manifest.toml` is what the e2e suite sends as `manifest_toml` on
#     `POST /v1/deploy-image`, deploying an image the suite already has;
#   * `tabbify.toml` is the only name a repo BUILD looks for. `deploy` and
#     `deploy_app` carry no port and no manifest argument (measured
#     2026-09-20 against the live node door), so a repo without this file is
#     built, deployed, and then health-probed on the platform default 8080 —
#     which this app does not listen on. The deploy reaches
#     `phase=failed stage=health` and nothing anywhere names the cause.
#
# Keep them identical. If one changes, change both in the same commit.
#
# Spellings that have each cost a measured failure here:
#   * ports are `[[runtime.ports]]`, never a scalar `[runtime] port`. The
#     manifest contract has no `deny_unknown_fields` (D8), so a scalar parses,
#     is dropped, and the boot probes the platform default instead.
#   * `stateful` / `data_mount` / `data_disk_mb` live in `[runtime]` and reach
#     the supervisor ONLY through this document — a deploy with no manifest is
#     ephemeral, with no error anywhere (`supervisor/src/build.rs`
#     `fetched_from_ref`).
[app]
name        = "e2e-stateful-marker"
kind        = "headless"
description = "Writes one marker file to its persistent data disk and reads it back"

[lifecycle]
# always_on: an on_request app parks, and a parked app makes "is it serving"
# and "did the disk attach" the same measurement.
mode = "always_on"

[runtime]
type = "firecracker"
# 64 MiB is the smallest disk that proves the mechanism. The backup is a zstd
# of a sparse ext4, so a bigger one buys the test nothing but minutes.
stateful     = true
data_mount   = "/data"
data_disk_mb = 64

[[runtime.ports]]
port     = 3000
protocol = "http"
expose   = "public"
primary  = true
