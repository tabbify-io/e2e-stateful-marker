# The manifest the e2e suite deploys this image with.
#
# This file is the SINGLE source of the stateful declaration for the IMAGE
# door: the live test sends its text verbatim as `manifest_toml` on
# `POST /v1/deploy-image`, and the offline contract test parses this same file.
# A constant in Python would be a second copy of a contract that already has
# two sides.
#
# `tabbify.toml` beside it is byte-identical for the declaration and exists for
# the other door: a repo BUILD reads only that name, and `deploy` carries no
# port argument, so without it the platform health-probes its own default 8080.
# Keep the two in step — change one, change both in the same commit.
#
# Spellings that have each cost a measured failure here:
#   * ports are `[[runtime.ports]]`, never a scalar `[runtime] port`. The
#     manifest contract has no `deny_unknown_fields` (D8), so a scalar parses,
#     is dropped, and the boot probes the platform default instead.
#   * `stateful` / `data_disk_mb` live in `[runtime]` and reach
#     the supervisor ONLY through this document — a deploy with no manifest is
#     ephemeral, with no error anywhere (`supervisor/src/build.rs`
#     `fetched_from_ref`).
#   * `data_mount` is GONE from the contract (manifest-contract f29825e, 2026-09-19:
#     every data disk is mounted at `/data`). A manifest that still declares it is
#     refused at the deploy door, naming the key — which is how this file was found
#     stale on 2026-09-20, the first time the platform read it for a repo build.
#
[app]
name        = "e2e-stateful-marker"
kind        = "headless"
description = "Writes one marker file to its persistent data disk and reads it back"

[lifecycle]
# always_on: an on_request app parks, and a parked app makes "is it serving"
# and "did the disk attach" the same measurement.
mode = "always_on"

[runtime]
type = "firecracker"
# 64 MiB is the smallest disk that proves the mechanism. The backup is a zstd
# of a sparse ext4, so a bigger one buys the test nothing but minutes.
stateful     = true
data_disk_mb = 64

[[runtime.ports]]
port     = 3000
protocol = "http"
expose   = "public"
primary  = true
